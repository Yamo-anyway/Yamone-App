name: Apply Yamone vector bottom nav

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-bottom-nav-vectors.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply vector bottom navigation
        run: python3 .github/scripts/patch_bottom_nav_vectors.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Use vector icons for Yamone bottom navigation'
          git push
