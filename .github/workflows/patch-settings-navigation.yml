name: Apply Yamone settings navigation polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-settings-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply settings and navigation polish
        run: python3 .github/scripts/patch_settings_navigation.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Polish settings and normalize back navigation'
          git push
