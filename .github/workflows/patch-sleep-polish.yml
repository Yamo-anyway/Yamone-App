name: Apply Yamone sleep polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sleep-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sleep polish
        run: python3 .github/scripts/patch_sleep_polish.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/MainActivity.java
          git commit -m 'Polish Yamone sleep overview UI'
          git push
