name: Apply Yamone subscreen polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-subscreen-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply subscreen polish
        run: python3 .github/scripts/patch_subscreen_polish.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Polish activity subscreens and ski theme'
          git push
