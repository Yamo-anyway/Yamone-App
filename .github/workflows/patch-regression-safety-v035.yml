name: Apply Yamone regression safety fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-regression-safety-v035.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply regression safety fixes
        run: python3 .github/scripts/patch_regression_safety_v035.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Harden recording and alarm regression paths'
          git push
