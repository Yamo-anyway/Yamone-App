name: Apply Yamone settings vector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-settings-vector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply settings vector button
        run: python3 .github/scripts/patch_settings_vector.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Use vector settings buttons on Yamone main tabs'
          git push
