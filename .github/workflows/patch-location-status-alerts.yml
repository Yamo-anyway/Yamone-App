name: Apply Yamone location status alerts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-location-status-alerts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply location status alert changes
        run: python3 .github/scripts/patch_location_status_alerts.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Add room status and local urgent alerts'
          git push
