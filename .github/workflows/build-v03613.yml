name: Build Yamone v0.36.13 Local-only Records APK

on:
  push:
    branches: [v36-13-work]
    paths: ['dev-dataset/**','app/**','build.gradle','gradle.properties','settings.gradle','dev-signing/**','design-preview/**','design-source/**','tools/**','.github/workflows/build-v03613.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Yamone v0.36.13
        shell: bash
        run: |
          bash tools/import-yamone-v23.sh design-source/yamone-v23.zip
          python3 tools/apply-v02602-sleep.py
          python3 tools/apply-v02701-alarm.py
          python3 tools/apply-v02801-snow.py
          python3 tools/fix-v02801-snow.py
          python3 tools/apply-v02802-home-stats.py
          python3 tools/apply-v03000-settings.py
          python3 tools/apply-v03100-auto-detect.py
          python3 tools/apply-v03200-gps-gap.py
          python3 tools/apply-v03300-alarm-finish.py
          python3 tools/apply-v03400-snow-package-validation.py
          python3 tools/apply-v03500-sleep-health.py
          python3 tools/apply-v03600-readiness.py
          python3 tools/apply-v03601-auto-detect-test-fixes.py
          python3 tools/apply-v03602-autodetect-assets.py
          python3 tools/apply-v03603-hybrid-autodetect.py
          python3 tools/apply-v03604-autodetect-ui-fix.py
          python3 tools/apply-v03605-autodetect-lifecycle-fixed.py
          python3 tools/apply-v03606-motion-window-auto-end-record-label.py
          python3 tools/apply-v03607-tunnel-developer-mode.py
          python3 tools/apply-v03608-location-dev-only.py
          python3 tools/apply-v03609-upload-dev-only.py
          python3 tools/apply-v03610-developer-dataset.py
          python3 tools/apply-v03611-macmini-dataset.py
          python3 tools/apply-v03612-final-cleanup.py
          python3 tools/apply-v03613-local-only-user-records.py

      - name: Validate local-only users and developer Mac mini sleep
        shell: bash
        run: |
          test ! -f app/src/main/java/com/yamo/snorelab/SupabaseActivityUploader.java
          test ! -f app/src/main/java/com/yamo/snorelab/SupabaseSleepUploader.java
          test -f app/src/main/java/com/yamo/snorelab/UploadExerciseActivity.java
          ! grep -q 'upload\|Supabase' app/src/main/java/com/yamo/snorelab/UploadExerciseActivity.java
          test -f app/src/main/java/com/yamo/snorelab/MacMiniSleepUploader.java
          test -f app/src/main/java/com/yamo/snorelab/SleepUploadUiEnhancer.java
          test -f app/src/main/java/com/yamo/snorelab/SleepUploadState.java
          grep -q 'https://yamone-data.anynow.net' app/src/main/java/com/yamo/snorelab/MacMiniSleepUploader.java
          grep -q '/dev-data/sleep' app/src/main/java/com/yamo/snorelab/MacMiniSleepUploader.java
          grep -q 'SystemSettingsBridge.isDeveloperMode' app/src/main/java/com/yamo/snorelab/MacMiniSleepUploader.java
          grep -q 'audio_uploaded",false' app/src/main/java/com/yamo/snorelab/MacMiniSleepUploader.java
          grep -q 'SystemSettingsBridge.isDeveloperMode(activity)' app/src/main/java/com/yamo/snorelab/SleepUploadUiEnhancer.java
          grep -q 'MacMiniSleepUploader.upload' app/src/main/java/com/yamo/snorelab/SleepUploadUiEnhancer.java
          ! grep -R -q 'SupabaseActivityUploader\|SupabaseSleepUploader' app/src/main/java
          ! grep -R -q 'walking-tracks\|sleep-audio' app/src/main/java app/src/main/assets/yamone-v23
          ! grep -q 'developerAuth' app/src/main/java/com/yamo/snorelab/SupabaseAnonymousRpcClient.java
          ! grep -q 'DevNetworkGuard' app/src/main/java/com/yamo/snorelab/SupabaseAnonymousRpcClient.java
          grep -q 'SupabaseAnonymousRpcClient.rpc' app/src/main/java/com/yamo/snorelab/SkiLiftApi.java
          grep -q 'https://yamone-data.anynow.net' app/src/main/java/com/yamo/snorelab/DevDatasetUploader.java
          grep -q '활동·수면 개인 기록은 야모네 서버로 전송하지 않습니다.' app/src/main/java/com/yamo/snorelab/MainActivity.java
          grep -q "versionCode 107" app/build.gradle
          grep -q "versionName '0.36.13'" app/build.gradle
          grep -q "const V='0.36.13'" app/src/main/assets/yamone-v23/v03610-dataset.js
          node --check app/src/main/assets/yamone-v23/v03610-dataset.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare development signing
        run: bash tools/prepare-dev-signing.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}

      - name: Dataset journal unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build developer APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-v0.36.13-local-only-macmini-sleep-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
