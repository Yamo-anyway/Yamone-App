name: Apply Yamone V0.3.9 alarm integration

on:
  push:
    branches: [alarm-v039]
    paths:
      - '.github/workflows/apply-v039-alarm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: alarm-v039
          fetch-depth: 0

      - name: Patch Yamone shell and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/yamo/snorelab/MainActivity.java')
          s = main.read_text(encoding='utf-8')

          old = '        if ("settings".equals(getIntent().getStringExtra("start_screen"))) showSettings();\n        else showSleep();'
          new = '''        String startScreen = getIntent().getStringExtra("start_screen");
          if ("settings".equals(startScreen)) showSettings();
          else if ("home".equals(startScreen)) showHome();
          else if ("activity".equals(startScreen)) showPlaceholderScreen("activity");
          else if ("ski".equals(startScreen)) showPlaceholderScreen("ski");
          else if ("alarm".equals(startScreen)) startActivity(new Intent(this, AlarmActivity.class));
          else showSleep();'''
          if old not in s:
              raise SystemExit('start_screen pattern missing')
          s = s.replace(old, new, 1)

          old = 'alarmNav = navItem("⏰\\n알람", false, v -> showPlaceholderScreen("alarm"));'
          new = 'alarmNav = navItem("⏰\\n알람", false, v -> startActivity(new Intent(this, AlarmActivity.class)));'
          if old not in s:
              raise SystemExit('alarm nav pattern missing')
          s = s.replace(old, new, 1)

          s = s.replace('v.setPadding(0, topInset + dp(8), 0, bottomInset);', 'v.setPadding(0, topInset + dp(4), 0, bottomInset);', 1)
          s = s.replace('header.setPadding(dp(18), dp(14), dp(18), dp(12));', 'header.setPadding(dp(18), dp(7), dp(18), dp(8));', 1)
          s = s.replace('header.setPadding(dp(12), dp(14), dp(18), dp(12));', 'header.setPadding(dp(12), dp(7), dp(18), dp(8));', 1)
          s = s.replace('지금은 수면 기능을 먼저 사용할 수 있어요.', '지금은 알람과 수면 기능을 사용할 수 있어요.', 1)
          main.write_text(s, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 11', 'versionCode 12', 1)
          g = g.replace("versionName '0.3.8-yamone-app'", "versionName '0.3.9-alarm'", 1)
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed development signing key
        shell: bash
        run: |
          base64 -d dev-signing/yamone-dev.keystore.b64 > dev-signing/yamone-dev.keystore
          keytool -list -keystore dev-signing/yamone-dev.keystore -storepass android -alias yamone-dev >/dev/null

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Compile V0.3.9
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "Yamone Build"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/yamo/snorelab/MainActivity.java app/build.gradle
          git commit -m "Integrate Yamone alarm into fixed app shell" || true
          git push origin HEAD:alarm-v039

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-v0.3.9-alarm-feature-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
