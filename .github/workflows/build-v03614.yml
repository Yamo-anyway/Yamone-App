name: Build Yamone v0.36.14 Developer UI Fixes APK

on:
  push:
    branches: [v36-14-work]
    paths: ['dev-dataset/**','app/**','build.gradle','gradle.properties','settings.gradle','dev-signing/**','design-preview/**','design-source/**','tools/**','.github/workflows/build-v03614.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Yamone v0.36.14
        shell: bash
        run: |
          bash tools/import-yamone-v23.sh design-source/yamone-v23.zip
          python3 tools/apply-v02602-sleep.py
          python3 tools/apply-v02701-alarm.py
          python3 tools/apply-v02801-snow.py
          python3 tools/fix-v02801-snow.py
          python3 tools/apply-v02802-home-stats.py
          python3 tools/apply-v03000-settings.py
          python3 tools/apply-v03100-auto-detect.py
          python3 tools/apply-v03200-gps-gap.py
          python3 tools/apply-v03300-alarm-finish.py
          python3 tools/apply-v03400-snow-package-validation.py
          python3 tools/apply-v03500-sleep-health.py
          python3 tools/apply-v03600-readiness.py
          python3 tools/apply-v03601-auto-detect-test-fixes.py
          python3 tools/apply-v03602-autodetect-assets.py
          python3 tools/apply-v03603-hybrid-autodetect.py
          python3 tools/apply-v03604-autodetect-ui-fix.py
          python3 tools/apply-v03605-autodetect-lifecycle-fixed.py
          python3 tools/apply-v03606-motion-window-auto-end-record-label.py
          python3 tools/apply-v03607-tunnel-developer-mode.py
          python3 tools/apply-v03608-location-dev-only.py
          python3 tools/apply-v03609-upload-dev-only.py
          python3 tools/apply-v03610-developer-dataset.py
          python3 tools/apply-v03611-macmini-dataset.py
          python3 tools/apply-v03612-final-cleanup.py
          python3 tools/apply-v03613-local-only-user-records.py
          python3 tools/prep-v03614-systemsettings.py
          python3 tools/apply-v03614-developer-ui-fixes.py
          python3 tools/post-v03614-systemsettings.py

      - name: Validate v0.36.14 requested fixes
        shell: bash
        run: |
          grep -q "versionCode 108" app/build.gradle
          grep -q "versionName '0.36.14'" app/build.gradle
          grep -q "Version 0.36.14" app/src/main/assets/yamone-v23/app.js
          ! grep -R -q "const V='0.36.13'" app/src/main/assets/yamone-v23/*-version.js
          ! grep -R -q "const V='0.36.12'" app/src/main/assets/yamone-v23/*-version.js
          grep -q "const V='0.36.14'" app/src/main/assets/yamone-v23/v03610-dataset.js

          grep -q "e.target.closest('#appVersionTap')" app/src/main/assets/yamone-v23/v03607-developer-mode.js
          ! grep -q "appInfoTapCount++" app/src/main/assets/yamone-v23/app.js
          ! grep -q "window.renderAppInfoSettings=function" app/src/main/assets/yamone-v23/v02801-snow.js
          grep -q "SystemSettingsBridge.isDeveloperMode(context)" app/src/main/java/com/yamo/snorelab/SnowBridge.java
          grep -q "SnowAutoDetectManager.sync(activity)" app/src/main/java/com/yamo/snorelab/SystemSettingsBridge.java
          grep -q "DevCaptureService.disable(activity)" app/src/main/java/com/yamo/snorelab/SystemSettingsBridge.java

          grep -q "uploadDeveloperAnalysis" app/src/main/java/com/yamo/snorelab/SleepBridge.java
          grep -q "developerUploaded" app/src/main/java/com/yamo/snorelab/SleepBridge.java
          grep -q "v03614SleepDeveloperUpload" app/src/main/assets/yamone-v23/v02602-sleep.js
          grep -q "MacMiniSleepUploader.upload" app/src/main/java/com/yamo/snorelab/SleepBridge.java
          grep -q "developer-macmini-upload.json" app/src/main/java/com/yamo/snorelab/SleepUploadState.java

          grep -q "자동 기록 · 업로드" app/src/main/assets/yamone-v23/v03610-dataset.js
          ! grep -q "수동 활동 진단 저장" app/src/main/assets/yamone-v23/v03610-dataset.js
          ! grep -q "승인된 기록 재전송" app/src/main/assets/yamone-v23/v03610-dataset.js
          ! grep -q "실제 활동 표시" app/src/main/assets/yamone-v23/v03610-dataset.js
          ! grep -q "진단 기록</div>" app/src/main/assets/yamone-v23/v03610-dataset.js

          node --check app/src/main/assets/yamone-v23/v03607-developer-mode.js
          node --check app/src/main/assets/yamone-v23/v02801-snow.js
          node --check app/src/main/assets/yamone-v23/v02602-sleep.js
          node --check app/src/main/assets/yamone-v23/v03610-dataset.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare development signing
        run: bash tools/prepare-dev-signing.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build developer APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-v0.36.14-developer-ui-fixes-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
