name: Patch activity GPS shadow handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-walking-gps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply GPS shadow handling
        run: python .github/scripts/patch_activity_gps_shadow.py

      - name: Verify patch markers
        run: |
          grep -q 'bridgeGpsShadow' app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q 'gpsShadowSegments' app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q 'v6_shadow' app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q 'bridgeGpsShadow' app/src/main/java/com/yamo/snorelab/HikingRecorderService.java
          grep -q 'local_hiking_v2_shadow' app/src/main/java/com/yamo/snorelab/HikingRecorderService.java

      - name: Commit patch
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java app/src/main/java/com/yamo/snorelab/HikingRecorderService.java
          git diff --cached --quiet && exit 0
          git commit -m 'Handle GPS shadow and tunnel sections across activities'
          git push
