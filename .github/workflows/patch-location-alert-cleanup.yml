name: Apply Yamone location alert cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-location-alert-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup patch
        run: python3 .github/scripts/patch_location_alert_cleanup.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/LocationSharingService.java
          git commit -m 'Clear local status alert state when leaving rooms'
          git push
