name: Remove Yamone mini game

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-remove-minigame.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove mini game from app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/yamo/snorelab/MainActivity.java')
          s = main.read_text()
          s = s.replace('    private TextView miniGameNav;\n', '')
          s = s.replace('        else if ("minigame".equals(startScreen)) startActivity(new Intent(this, MiniGameActivity.class));\n', '')
          s = s.replace('        miniGameNav = navItem("🎮\\n미니게임", false, v -> startActivity(new Intent(this, MiniGameActivity.class)));\n', '')
          s = s.replace('        nav.addView(miniGameNav, new LinearLayout.LayoutParams(0, dp(60), 1f));\n', '')
          s = s.replace('        styleNav(miniGameNav, false);\n', '')
          main.write_text(s)

          exercise = Path('app/src/main/java/com/yamo/snorelab/ExerciseActivity.java')
          s = exercise.read_text()
          s = s.replace('        nav.addView(navItem("🎮\\n미니게임", MUTED, v -> { startActivity(new Intent(this, MiniGameActivity.class)); finish(); }), new LinearLayout.LayoutParams(0, dp(60), 1f));\n', '')
          exercise.write_text(s)

          alarm = Path('app/src/main/java/com/yamo/snorelab/AlarmActivity.java')
          s = alarm.read_text()
          s = s.replace('        nav.addView(navItem("🎮\\n미니게임", false, v -> { startActivity(new Intent(this, MiniGameActivity.class)); finish(); }), new LinearLayout.LayoutParams(0, dp(60), 1f));\n', '')
          alarm.write_text(s)

          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('        <activity android:name=".MiniGameActivity" android:screenOrientation="portrait" android:exported="false" />\n', '')
          manifest.write_text(s)

          mini = Path('app/src/main/java/com/yamo/snorelab/MiniGameActivity.java')
          if mini.exists():
              mini.unlink()
          PY

      - name: Verify mini game is gone
        shell: bash
        run: |
          test ! -e app/src/main/java/com/yamo/snorelab/MiniGameActivity.java
          ! grep -R -n -E 'MiniGameActivity|miniGameNav|미니게임|start_screen.*minigame' app/src/main

      - name: Commit removal
        shell: bash
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A app/src/main
          git commit -m 'Remove mini game from Yamone app'
          git push
