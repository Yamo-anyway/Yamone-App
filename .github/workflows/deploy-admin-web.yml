name: Deploy Yamone Admin Web

on:
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/deploy-admin-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yamone-admin-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check admin-web/app.js
          node --check admin-web/admin-id.js
          node --check admin-web/admin-delete.js
          node --check admin-web/admin-readiness.js
      - name: Check required files
        run: |
          test -f admin-web/index.html
          test -f admin-web/styles.css
          test -f admin-web/admin-delete.css
          test -f admin-web/admin-readiness.css
          test -f admin-web/app.js
          test -f admin-web/admin-id.js
          test -f admin-web/admin-delete.js
          test -f admin-web/admin-readiness.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Pages availability
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Pages activation notice
        if: steps.pages.outcome != 'success'
        run: echo "GitHub Pages is not enabled yet. Enable Settings > Pages > Source > GitHub Actions, then run this workflow again."
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-web
      - name: Deploy to GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
