name: Patch Yamone v0.3.52 location UI

on:
  push:
    paths:
      - '.github/workflows/patch-v052-location-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply location sharing patch
        run: python .github/scripts/patch_v052_location_ui.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yamo/snorelab/LocationSharingActivity.java \
                  app/src/main/java/com/yamo/snorelab/LocationSharingMapView.java \
                  app/src/main/res/drawable/ic_location_refresh.xml \
                  app/src/main/res/drawable/yamone_launcher_background.xml
          git diff --cached --quiet && exit 0
          git commit -m "Polish location sharing status refresh and map UI"
          git push
