name: Apply location background recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-location-background-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply location background recovery patch
        run: python3 .github/scripts/patch_location_background_recovery.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Harden location sharing background recovery'
          git push
