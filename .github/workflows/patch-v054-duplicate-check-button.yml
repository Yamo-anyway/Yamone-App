name: Patch Yamone v0.3.54 duplicate check button

on:
  push:
    paths:
      - '.github/workflows/patch-v054-duplicate-check-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply button sizing patch
        run: python3 .github/scripts/patch_v054_duplicate_check_button.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yamo/snorelab/LocationSharingActivity.java
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine duplicate check button alignment"
          git push
