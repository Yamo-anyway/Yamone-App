name: Apply Yamone location header and home state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-location-header-home-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply location header and home state updates
        run: python3 .github/scripts/patch_location_header_home_state.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Restore location header and refresh sharing state'
          git push
