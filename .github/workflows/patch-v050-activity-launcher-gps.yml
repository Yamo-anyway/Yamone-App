name: Apply Yamone v0.3.50 activity launcher GPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v050-activity-launcher-gps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply activity launcher GPS patch
        run: python3 .github/scripts/patch_v050_activity_launcher_gps.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/ExerciseActivity.java \
                  app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java \
                  app/src/main/java/com/yamo/snorelab/WalkingMapView.java \
                  app/src/main/res/drawable-nodpi/yamone_launcher_day_night.webp \
                  app/src/main/res/drawable/yamone_launcher_background.xml \
                  app/src/main/res/drawable/yamone_launcher_foreground_clear.xml \
                  app/src/main/res/drawable/ic_activity_control_pause.xml \
                  app/src/main/res/drawable/ic_activity_control_play.xml \
                  app/src/main/res/drawable/ic_activity_control_stop.xml \
                  app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
                  app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          git commit -m 'Apply Yamone v0.3.50 activity UI GPS and launcher'
          git push
