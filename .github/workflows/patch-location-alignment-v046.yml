name: Apply Yamone location alignment polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-location-alignment-v046.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply location alignment polish
        run: python3 .github/scripts/patch_location_alignment_v046.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/LocationSharingActivity.java
          git commit -m 'Polish location sharing vertical alignment'
          git push
