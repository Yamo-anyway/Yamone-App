name: Apply location sharing UX patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-location-share-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_location_share.py
      - name: Verify
        run: |
          test ! -e app/src/main/java/com/yamo/snorelab/MiniGameActivity.java
          ! grep -R -n -E '내 닉네임 변경|showNicknameDialog|updateNickname\(' app/src/main/java/com/yamo/snorelab
          grep -q 'snapshotFresh' app/src/main/java/com/yamo/snorelab/LocationSharingApi.java
          grep -q 'INITIAL_FIX_MIN_TIME_MS' app/src/main/java/com/yamo/snorelab/LocationSharingService.java
      - name: Commit
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/LocationSharingActivity.java app/src/main/java/com/yamo/snorelab/LocationSharingApi.java app/src/main/java/com/yamo/snorelab/LocationSharingService.java
          git commit -m 'Simplify nickname and speed up first shared location'
          git push
