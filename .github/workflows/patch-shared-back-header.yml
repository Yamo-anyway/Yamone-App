name: Apply shared Yamone back header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-shared-back-header.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace back headers with shared design
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('app/src/main/java/com/yamo/snorelab')

          def replace_method(name, signature, replacement):
              p = ROOT / name
              s = p.read_text()
              start = s.find(signature)
              if start < 0:
                  raise SystemExit(f'{name}: method signature not found: {signature}')
              brace = s.find('{', start)
              if brace < 0:
                  raise SystemExit(f'{name}: opening brace not found')
              depth = 0
              end = None
              for i in range(brace, len(s)):
                  if s[i] == '{': depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit(f'{name}: closing brace not found')
              p.write_text(s[:start] + replacement + s[end + 1:])

          def replace_region(name, anchor, start_marker, end_marker, replacement):
              p = ROOT / name
              s = p.read_text()
              a = s.find(anchor)
              if a < 0:
                  raise SystemExit(f'{name}: anchor not found: {anchor}')
              start = s.find(start_marker, a)
              if start < 0:
                  raise SystemExit(f'{name}: start marker not found')
              end = s.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{name}: end marker not found')
              p.write_text(s[:start] + replacement + s[end:])

          replace_method(
              'MainActivity.java',
              'private LinearLayout fixedBackHeader(String title, String subtitle, View.OnClickListener backClick)',
          '''private LinearLayout fixedBackHeader(String title, String subtitle, View.OnClickListener backClick) {
              LinearLayout header = YamoneBackHeader.create(this, title, subtitle, BG, TEXT, MUTED, backClick);
              header.setPadding(dp(12), dp(7), dp(18), dp(8));
              return header;
          }''')

          replace_method(
              'AlarmActivity.java',
              'private LinearLayout fixedBackHeader(String title, String subtitle)',
          '''private LinearLayout fixedBackHeader(String title, String subtitle) {
              LinearLayout header = YamoneBackHeader.create(this, title, subtitle, BG, TEXT, MUTED, v -> showList());
              header.setPadding(dp(12), dp(7), dp(18), dp(8));
              return header;
          }''')

          replace_method(
              'HikingActivity.java',
              'private View header(String title, String subtitle, View.OnClickListener backClick)',
          '''private View header(String title, String subtitle, View.OnClickListener backClick) {
              return YamoneBackHeader.create(this, title, subtitle, bg(), textColor(), muted(), backClick);
          }''')

          replace_method(
              'LocationSharingActivity.java',
              'private LinearLayout header(String title, String subtitle)',
          '''private LinearLayout header(String title, String subtitle) {
              LinearLayout header = YamoneBackHeader.create(this, title, subtitle, BG, TEXT, MUTED, v -> {
                  if ("room_form".equals(currentPage)) showLanding();
                  else finish();
              });
              header.setPadding(dp(10), dp(5), dp(18), dp(5));
              return header;
          }''')

          replace_method(
              'SkiActivity.java',
              'private View header()',
          '''private View header() {
              return YamoneBackHeader.create(this, "스키 / 스노보드", "오늘의 설원을 기록해요", BG, TEXT, MUTED, v -> finish());
          }''')

          replace_method(
              'ExerciseActivity.java',
              'private View backHeader(String title)',
          '''private View backHeader(String title) {
              return YamoneBackHeader.create(this, title, null, BG, TEXT, MUTED, v -> showHome());
          }''')

          # Activity top-level Back always returns Home. Detail Back still returns Activity first.
          replace_method(
              'ExerciseActivity.java',
              'public void onBackPressed()',
          '''public void onBackPressed() {
              if (detailOpen) { detailOpen = false; detailDir = null; showHome(); return; }
              startActivity(new Intent(this, MainActivity.class).putExtra("start_screen", "home"));
              finish();
          }''')

          replace_region(
              'ExerciseActivity.java',
              'String icon = activityIcon(type);',
              '        LinearLayout top = new LinearLayout(this); top.setOrientation(LinearLayout.HORIZONTAL); top.setGravity(Gravity.CENTER_VERTICAL);',
              '        if (justFinished) {',
          '''        page.addView(YamoneBackHeader.create(this,
                  justFinished ? icon + " " + label + " 완료" : icon + " " + label + " 기록",
                  null, BG, TEXT, MUTED,
                  v -> { detailOpen = false; showHome(); }));

          ''')

          replace_region(
              'SkiSessionDetailActivity.java',
              'String icon = "스노보드".equals(sport)',
              '        LinearLayout header = new LinearLayout(this);',
              '        if (justFinished) {',
          '''        page.addView(YamoneBackHeader.create(this, icon + " " + sport + " 기록", null,
                  BG, TEXT, MUTED, v -> finish()));

          ''')

          replace_region(
              'SkiWaitTimesActivity.java',
              'setContentView(scroll);',
              '        LinearLayout header = new LinearLayout(this);',
              '        LinearLayout controls = new LinearLayout(this);',
          '''        page.addView(YamoneBackHeader.create(this, "현재 예상 대기시간",
                  resortName.isEmpty() ? "현재 스키장" : resortName,
                  BG, TEXT, MUTED, v -> finish()));

          ''')

          replace_region(
              'LocationSharingTimeActivity.java',
              'applyInsets(root);',
              '        LinearLayout top = new LinearLayout(this);',
              '        ScrollView scroll = new ScrollView(this);',
          '''        LinearLayout top = YamoneBackHeader.create(this, "공유 시간 연장", null,
                  BG, TEXT, MUTED, v -> finish());
              top.setPadding(dp(10), dp(5), dp(18), dp(5));
              root.addView(top);

          ''')

          v2 = ROOT / 'LocationSharingActivityV2.java'
          s = v2.read_text().replace('findExact(root, "‹")', 'findExact(root, "←")')
          v2.write_text(s)

          # Verify all old chevron-style top-back glyphs are gone from Java screens.
          remaining = []
          for p in ROOT.glob('*.java'):
              if '"‹"' in p.read_text():
                  remaining.append(p.name)
          if remaining:
              raise SystemExit('Old back glyph remains in: ' + ', '.join(remaining))
          PY
      - name: Commit
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Unify Yamone back headers and activity back behavior'
          git push
