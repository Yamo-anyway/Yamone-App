name: Patch Yamone activity scroll and navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-nav-back-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fix activity scroll reset and navigation transition
        run: python3 .github/scripts/fix_activity_scroll_and_nav.py

      - name: Verify fixes
        run: |
          grep -q 'Clear stale live-view references' app/src/main/java/com/yamo/snorelab/ExerciseActivity.java
          grep -q 'Animation.SnoreLab.NoTransition' app/src/main/res/values/themes.xml

      - name: Commit fix
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/ExerciseActivity.java app/src/main/res/values/themes.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix activity scroll reset and bottom navigation transitions'
          git push
