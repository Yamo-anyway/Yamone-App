name: Patch Yamone navigation and spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-nav-back-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run patch script
        run: python3 .github/scripts/patch_nav_spacing.py

      - name: Verify expected changes
        run: |
          grep -q 'versionCode 16' app/build.gradle
          grep -q 'LocationExerciseActivity.class' app/src/main/java/com/yamo/snorelab/MainActivity.java
          grep -q 'currentPage = "room_form"' app/src/main/java/com/yamo/snorelab/LocationSharingActivity.java
          grep -q 'returnFromSettings' app/src/main/java/com/yamo/snorelab/MainActivity.java

      - name: Commit patch
        run: |
          git config user.name 'Yamo'
          git config user.email 'diahnet@naver.com'
          git add app
          git commit -m 'Fix bottom navigation back flow and location spacing'
          git push
