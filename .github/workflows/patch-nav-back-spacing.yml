name: Patch Yamone navigation and spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-nav-back-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate alarm back handler
        run: python3 .github/scripts/fix_alarm_duplicate.py

      - name: Commit fix
        run: |
          git config user.name 'Yamo'
          git config user.email 'diahnet@naver.com'
          git add app/src/main/java/com/yamo/snorelab/AlarmActivity.java
          git commit -m 'Fix duplicate alarm back handler'
          git push
