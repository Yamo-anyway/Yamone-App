name: Build Yamone Android APK

on:
  push:
    branches: [main, renewal-v23, v29-00-work, v30-00-work, v31-00-work, v32-00-work, v33-00-work, v34-00-work, v35-00-work, v36-00-work, v36-01-work, v36-02-work, v36-03-work, v36-04-work, v36-05-work, v36-06-work, v36-07-work, v36-08-work, v36-09-work, v36-10-work]
    paths: ['dev-dataset/**','app/**','build.gradle','gradle.properties','settings.gradle','dev-signing/**','design-preview/**','design-source/**','tools/**','.github/workflows/build-android.yml','INTEGRATION_CHECKLIST_V36.md','TEST_CHECKLIST_V36_01.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Yamone v0.36.10
        shell: bash
        run: |
          bash tools/import-yamone-v23.sh design-source/yamone-v23.zip
          python3 tools/apply-v02602-sleep.py
          python3 tools/apply-v02701-alarm.py
          python3 tools/apply-v02801-snow.py
          python3 tools/fix-v02801-snow.py
          python3 tools/apply-v02802-home-stats.py
          python3 tools/apply-v03000-settings.py
          python3 tools/apply-v03100-auto-detect.py
          python3 tools/apply-v03200-gps-gap.py
          python3 tools/apply-v03300-alarm-finish.py
          python3 tools/apply-v03400-snow-package-validation.py
          python3 tools/apply-v03500-sleep-health.py
          python3 tools/apply-v03600-readiness.py
          python3 tools/apply-v03601-auto-detect-test-fixes.py
          python3 tools/apply-v03602-autodetect-assets.py
          python3 tools/apply-v03603-hybrid-autodetect.py
          python3 tools/apply-v03604-autodetect-ui-fix.py
          python3 tools/apply-v03605-autodetect-lifecycle-fixed.py
          python3 tools/apply-v03606-motion-window-auto-end-record-label.py
          python3 tools/apply-v03607-tunnel-developer-mode.py
          python3 tools/apply-v03608-location-dev-only.py
          python3 tools/apply-v03609-upload-dev-only.py
          python3 tools/apply-v03610-developer-dataset.py

      - name: Validate integrated non-location-sharing features
        shell: bash
        run: |
          node --check app/src/main/assets/yamone-v23/v02508-real-move.js
          node --check app/src/main/assets/yamone-v23/v02513-records.js
          node --check app/src/main/assets/yamone-v23/v02516-auto-detect.js
          node --check app/src/main/assets/yamone-v23/v02602-sleep.js
          node --check app/src/main/assets/yamone-v23/v02801-snow.js
          node --check app/src/main/assets/yamone-v23/v02900-record-maintenance.js
          node --check app/src/main/assets/yamone-v23/v03000-settings.js
          node --check app/src/main/assets/yamone-v23/v03600-readiness.js
          node --check app/src/main/assets/yamone-v23/v03604-autodetect-ui.js
          node --check app/src/main/assets/yamone-v23/v03607-developer-mode.js
          node --check app/src/main/assets/yamone-v23/v03610-dataset.js
          node --check admin-web/admin-dataset.js
          python3 -m unittest discover -s dev-dataset/tests -p test_analysis.py -v
          grep -q 'locationSharingExcluded' app/src/main/java/com/yamo/snorelab/AppReadinessBridge.java
          grep -q 'KEY_CONFIRM_SECONDS' app/src/main/java/com/yamo/snorelab/ActivityAutoDetectManager.java
          grep -q 'KEY_END_INACTIVITY_MIN' app/src/main/java/com/yamo/snorelab/ActivityAutoDetectManager.java
          grep -q 'sanitizeEndInactivityMin' app/src/main/java/com/yamo/snorelab/ActivityAutoDetectManager.java
          grep -q 'armAutoEnd' app/src/main/java/com/yamo/snorelab/ActivityAutoDetectManager.java
          grep -q 'onRecordingMotion' app/src/main/java/com/yamo/snorelab/ActivityAutoDetectManager.java
          grep -q 'KEY_CANDIDATE_ACTIVE_MS' app/src/main/java/com/yamo/snorelab/ActivityHybridDetectorService.java
          grep -q 'START_NO_MOTION_RESET_MS = 3_000L' app/src/main/java/com/yamo/snorelab/ActivityHybridDetectorService.java
          grep -q 'hasValidMovementEvidence' app/src/main/java/com/yamo/snorelab/ActivityHybridDetectorService.java
          grep -q 'candidateActiveMs' app/src/main/java/com/yamo/snorelab/ActivityHybridDetectorService.java
          grep -q 'EXTRA_AUTO_DETECT_START_MODE' app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q 'KEY_LAST_MEANINGFUL_MOTION_MS' app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q 'autoDetectStartMode' app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q 'autoDetectStartMode' app/src/main/java/com/yamo/snorelab/SavedMovementRecordsBridge.java
          grep -q '자동감지 이동(자동)' app/src/main/assets/yamone-v23/v02513-records.js
          grep -q '자동감지 이동(수동)' app/src/main/assets/yamone-v23/v02513-records.js
          grep -q 'v3606EndInactive' app/src/main/assets/yamone-v23/v02516-auto-detect.js
          grep -q '1분 이후' app/src/main/assets/yamone-v23/v02516-auto-detect.js
          grep -q '5분 이후' app/src/main/assets/yamone-v23/v02516-auto-detect.js
          grep -q '유효 움직임' app/src/main/assets/yamone-v23/v02516-auto-detect.js
          grep -q '3초 이상' app/src/main/assets/yamone-v23/v02516-auto-detect.js
          grep -q 'KEY_GPS_SIGNAL_STATE' app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q 'bridgeStartDistanceM' app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q 'crossingMovingMs' app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q 'developer_mode_required' app/src/main/java/com/yamo/snorelab/MovementBridge.java
          grep -q 'isDeveloperMode' app/src/main/java/com/yamo/snorelab/SystemSettingsBridge.java
          grep -q 'setDeveloperMode' app/src/main/java/com/yamo/snorelab/SystemSettingsBridge.java
          grep -q 'UNLOCK_TAPS=7' app/src/main/assets/yamone-v23/v03607-developer-mode.js
          grep -q '일반 사용자 모드로 전환' app/src/main/assets/yamone-v23/v03607-developer-mode.js
          grep -q 'gateLocationSharing' app/src/main/assets/yamone-v23/v03607-developer-mode.js
          grep -q 'v3608DeveloperOnlyLocation' app/src/main/assets/yamone-v23/v03607-developer-mode.js
          grep -q '위치공유' app/src/main/assets/yamone-v23/v03607-developer-mode.js
          grep -q 'SystemSettingsBridge.isDeveloperMode(this)' app/src/main/java/com/yamo/snorelab/UploadExerciseActivity.java
          grep -q 'SystemSettingsBridge.isDeveloperMode(activity)' app/src/main/java/com/yamo/snorelab/SleepUploadUiEnhancer.java
          grep -q '기록 업로드는 개발자 모드에서만 사용할 수 있습니다.' app/src/main/java/com/yamo/snorelab/SupabaseActivityUploader.java
          grep -q '기록 업로드는 개발자 모드에서만 사용할 수 있습니다.' app/src/main/java/com/yamo/snorelab/SupabaseSleepUploader.java
          grep -q '녹음과 분석 기록은 앱 내부에 저장합니다.' app/src/main/java/com/yamo/snorelab/MainActivity.java
          grep -q '수면 기록은 휴대폰 내부 저장소에서 관리합니다.' app/src/main/java/com/yamo/snorelab/MainActivity.java
          grep -q 'class SnowMapPackageValidator' app/src/main/java/com/yamo/snorelab/SnowMapPackageValidator.java
          grep -q 'KEY_HEARTBEAT_MS' app/src/main/java/com/yamo/snorelab/SleepRecorderService.java
          grep -q "versionCode 104" app/build.gradle
          grep -q "versionName '0.36.10'" app/build.gradle
          grep -q '0.36.10' app/src/main/assets/yamone-v23/v03610-dataset.js
          test -f INTEGRATION_CHECKLIST_V36.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore development signing key
        shell: bash
        run: |
          mkdir -p dev-signing
          base64 -d dev-signing/yamone-dev.keystore.b64 > dev-signing/yamone-dev.keystore
          keytool -list -keystore dev-signing/yamone-dev.keystore -storepass android -alias yamone-dev >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}

      - name: Dataset journal unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build developer APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify release Snow gate
        run: gradle :app:processReleaseMainManifest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-v0.36.10-developer-dataset-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
