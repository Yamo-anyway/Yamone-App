name: Build Yamone Android APK

on:
  push:
    branches: [main, renewal-v23]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'dev-signing/**'
      - 'design-preview/**'
      - 'design-source/**'
      - 'tools/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import approved design + v0.27.01 real alarm
        shell: bash
        run: |
          bash tools/import-yamone-v23.sh design-source/yamone-v23.zip
          python3 tools/apply-v02602-sleep.py
          python3 tools/apply-v02701-alarm.py

      - name: Validate app JavaScript and real alarm integration
        shell: bash
        run: |
          node --check app/src/main/assets/yamone-v23/v02501-ui.js
          node --check app/src/main/assets/yamone-v23/v02505-summary.js
          node --check app/src/main/assets/yamone-v23/v02507-move.js
          node --check app/src/main/assets/yamone-v23/v02507-fit.js
          node --check app/src/main/assets/yamone-v23/v02501-navigation.js
          node --check app/src/main/assets/yamone-v23/v02508-real-move.js
          node --check app/src/main/assets/yamone-v23/v02510-ui.js
          node --check app/src/main/assets/yamone-v23/v02511-home-active.js
          node --check app/src/main/assets/yamone-v23/v02512-notification.js
          node --check app/src/main/assets/yamone-v23/v02513-records.js
          node --check app/src/main/assets/yamone-v23/v02514-partial-pace.js
          node --check app/src/main/assets/yamone-v23/v02515-record-detail.js
          node --check app/src/main/assets/yamone-v23/v02516-auto-detect.js
          node --check app/src/main/assets/yamone-v23/v02602-sleep.js
          node --check app/src/main/assets/yamone-v23/v02701-alarm.js
          node --check app/src/main/assets/yamone-v23/v02701-version.js
          grep -q "v02510UpdateGlance" app/src/main/assets/yamone-v23/v02508-real-move.js
          grep -q "yamoneOpenActiveMovement" app/src/main/assets/yamone-v23/v02512-notification.js
          grep -q "class SleepBridge" app/src/main/java/com/yamo/snorelab/SleepBridge.java
          grep -q "yamoneOpenActiveSleep" app/src/main/assets/yamone-v23/v02602-sleep.js
          grep -q "class AlarmBridge" app/src/main/java/com/yamo/snorelab/AlarmBridge.java
          grep -q "class YamoneAlarmTone" app/src/main/java/com/yamo/snorelab/YamoneAlarmTone.java
          grep -q "YamoneAlarm" app/src/main/java/com/yamo/snorelab/YamoneMovementActivity.java
          grep -q "YamoneAlarm" app/src/main/java/com/yamo/snorelab/YamoneDesignPreviewActivity.java
          grep -q "EXTRA_OPEN_ALARM" app/src/main/java/com/yamo/snorelab/YamoneDesignPreviewActivity.java
          grep -q "snoozeCount" app/src/main/java/com/yamo/snorelab/AlarmStore.java
          grep -q "shakeStrength" app/src/main/java/com/yamo/snorelab/AlarmStore.java
          grep -q "YamoneAlarmTone.synth" app/src/main/java/com/yamo/snorelab/AlarmRingService.java
          grep -q "canSnooze" app/src/main/java/com/yamo/snorelab/AlarmRingActivity.java
          grep -q "yamoneOpenAlarmList" app/src/main/assets/yamone-v23/v02701-alarm.js
          grep -q "야모네 전용 알람음 5종" app/src/main/assets/yamone-v23/v02701-alarm.js
          grep -q "alarm-title-asset" app/src/main/assets/yamone-v23/v02701-alarm.css
          grep -q "border-right:0" app/src/main/assets/yamone-v23/v02701-alarm.css
          grep -q "0.27.01" app/src/main/assets/yamone-v23/v02701-version.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed development signing key
        shell: bash
        run: |
          mkdir -p dev-signing
          base64 -d dev-signing/yamone-dev.keystore.b64 > dev-signing/yamone-dev.keystore
          keytool -list -keystore dev-signing/yamone-dev.keystore -storepass android -alias yamone-dev >/dev/null

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-v0.27.01-real-alarm-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
