name: Build Yamone Android APK

on:
  push:
    branches: [main, renewal-v23, v29-00-work, v30-00-work, v31-00-work, v32-00-work]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'dev-signing/**'
      - 'design-preview/**'
      - 'design-source/**'
      - 'tools/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import approved design + v0.32.00 GPS gap handling
        shell: bash
        run: |
          bash tools/import-yamone-v23.sh design-source/yamone-v23.zip
          python3 tools/apply-v02602-sleep.py
          python3 tools/apply-v02701-alarm.py
          python3 tools/apply-v02801-snow.py
          python3 tools/fix-v02801-snow.py
          python3 tools/apply-v02802-home-stats.py
          python3 tools/apply-v03000-settings.py
          python3 tools/apply-v03100-auto-detect.py
          python3 tools/apply-v03200-gps-gap.py
          python3 tools/apply-v03200-version.py

      - name: Validate GPS gap handling and existing features
        shell: bash
        run: |
          node --check app/src/main/assets/yamone-v23/v02508-real-move.js
          node --check app/src/main/assets/yamone-v23/v02516-auto-detect.js
          node --check app/src/main/assets/yamone-v23/v02900-record-maintenance.js
          node --check app/src/main/assets/yamone-v23/v03000-settings.js
          node --check app/src/main/assets/yamone-v23/v03200-version.js
          grep -q "KEY_GPS_SIGNAL_STATE" app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q "strongContinuity" app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q "gpsShadowPolicy" app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q "gpsSignalState" app/src/main/java/com/yamo/snorelab/MovementBridge.java
          grep -q "GPS 미확인 · 기록 계속" app/src/main/assets/yamone-v23/v02508-real-move.js
          grep -q "DetectedActivity.IN_VEHICLE" app/src/main/java/com/yamo/snorelab/ActivityAutoDetectManager.java
          grep -q "class SystemSettingsBridge" app/src/main/java/com/yamo/snorelab/SystemSettingsBridge.java
          grep -q "trimSavedRecordEnd" app/src/main/java/com/yamo/snorelab/SavedMovementRecordsBridge.java
          grep -q 'enabled="${snowFeatureEnabled}"' app/src/main/AndroidManifest.xml
          grep -q "0.32.00" app/src/main/assets/yamone-v23/v03200-version.js
          grep -q "versionName '0.32.00'" app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed development signing key
        shell: bash
        run: |
          mkdir -p dev-signing
          base64 -d dev-signing/yamone-dev.keystore.b64 > dev-signing/yamone-dev.keystore
          keytool -list -keystore dev-signing/yamone-dev.keystore -storepass android -alias yamone-dev >/dev/null

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build developer APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify release Snow components are disabled
        shell: bash
        run: |
          gradle :app:processReleaseMainManifest --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifests = list(Path('app/build/intermediates').rglob('AndroidManifest.xml'))
          release = [p for p in manifests if 'release' in str(p).lower()]
          if not release: raise SystemExit('release merged manifest not found')
          text = max(release, key=lambda p: p.stat().st_mtime).read_text(encoding='utf-8')
          required = ['SkiActivity','SkiSessionDetailActivity','SkiWaitTimesActivity','SkiRecorderService','SnowGeofenceReceiver']
          for short in required:
              m = re.search(r'<(?:activity|service|receiver)\b[^>]*android:name="(?:com.yamo.snorelab.)?'+re.escape(short)+r'"[^>]*>', text)
              if not m or 'android:enabled="false"' not in m.group(0): raise SystemExit(f'Snow release gate missing for {short}')
          print('Release Snow component gate verified')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-v0.32.00-gps-gap-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
