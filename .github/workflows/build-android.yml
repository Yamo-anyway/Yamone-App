name: Build Yamone Android APK

on:
  push:
    branches: [main, renewal-v23, v29-00-work, v30-00-work]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'dev-signing/**'
      - 'design-preview/**'
      - 'design-source/**'
      - 'tools/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import approved design + v0.30.00 real settings
        shell: bash
        run: |
          bash tools/import-yamone-v23.sh design-source/yamone-v23.zip
          python3 tools/apply-v02602-sleep.py
          python3 tools/apply-v02701-alarm.py
          python3 tools/apply-v02801-snow.py
          python3 tools/fix-v02801-snow.py
          python3 tools/apply-v02802-home-stats.py
          python3 tools/apply-v03000-settings.py

      - name: Validate app JavaScript, settings bridge, record maintenance and Snow release gate
        shell: bash
        run: |
          node --check app/src/main/assets/yamone-v23/v02501-ui.js
          node --check app/src/main/assets/yamone-v23/v02505-summary.js
          node --check app/src/main/assets/yamone-v23/v02507-move.js
          node --check app/src/main/assets/yamone-v23/v02507-fit.js
          node --check app/src/main/assets/yamone-v23/v02501-navigation.js
          node --check app/src/main/assets/yamone-v23/v02508-real-move.js
          node --check app/src/main/assets/yamone-v23/v02510-ui.js
          node --check app/src/main/assets/yamone-v23/v02511-home-active.js
          node --check app/src/main/assets/yamone-v23/v02512-notification.js
          node --check app/src/main/assets/yamone-v23/v02513-records.js
          node --check app/src/main/assets/yamone-v23/v02514-partial-pace.js
          node --check app/src/main/assets/yamone-v23/v02515-record-detail.js
          node --check app/src/main/assets/yamone-v23/v02516-auto-detect.js
          node --check app/src/main/assets/yamone-v23/v02602-sleep.js
          node --check app/src/main/assets/yamone-v23/v02701-alarm.js
          node --check app/src/main/assets/yamone-v23/v02801-snow.js
          node --check app/src/main/assets/yamone-v23/v02802-home-stats.js
          node --check app/src/main/assets/yamone-v23/v02900-record-maintenance.js
          node --check app/src/main/assets/yamone-v23/v03000-settings.js
          node --check app/src/main/assets/yamone-v23/v03000-version.js
          grep -q "class SystemSettingsBridge" app/src/main/java/com/yamo/snorelab/SystemSettingsBridge.java
          grep -q "YamoneSystemSettings" app/src/main/java/com/yamo/snorelab/YamoneMovementActivity.java
          grep -q "YamoneSystemSettings" app/src/main/java/com/yamo/snorelab/YamoneDesignPreviewActivity.java
          grep -q "getPermissionState" app/src/main/java/com/yamo/snorelab/SystemSettingsBridge.java
          grep -q "getStorageState" app/src/main/java/com/yamo/snorelab/SystemSettingsBridge.java
          grep -q "settingPage==='권한'" app/src/main/assets/yamone-v23/v03000-settings.js
          grep -q "settingPage==='데이터/저장'" app/src/main/assets/yamone-v23/v03000-settings.js
          grep -q "deleteSavedRecord" app/src/main/java/com/yamo/snorelab/SavedMovementRecordsBridge.java
          grep -q "trimSavedRecordEnd" app/src/main/java/com/yamo/snorelab/SavedMovementRecordsBridge.java
          grep -q "class MovementRecordEditor" app/src/main/java/com/yamo/snorelab/MovementRecordEditor.java
          grep -q "class SnowBridge" app/src/main/java/com/yamo/snorelab/SnowBridge.java
          grep -q 'enabled="${snowFeatureEnabled}"' app/src/main/AndroidManifest.xml
          grep -q "snowFeatureEnabled: 'true'" app/build.gradle
          grep -q "snowFeatureEnabled: 'false'" app/build.gradle
          grep -q "0.30.00" app/src/main/assets/yamone-v23/v03000-version.js
          grep -q "versionName '0.30.00'" app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed development signing key
        shell: bash
        run: |
          mkdir -p dev-signing
          base64 -d dev-signing/yamone-dev.keystore.b64 > dev-signing/yamone-dev.keystore
          keytool -list -keystore dev-signing/yamone-dev.keystore -storepass android -alias yamone-dev >/dev/null

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build developer APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify release Snow components are disabled
        shell: bash
        run: |
          gradle :app:processReleaseMainManifest --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifests = list(Path('app/build/intermediates').rglob('AndroidManifest.xml'))
          release = [p for p in manifests if 'release' in str(p).lower()]
          if not release:
              raise SystemExit('release merged manifest not found')
          text = max(release, key=lambda p: p.stat().st_mtime).read_text(encoding='utf-8')
          required = [
              'com.yamo.snorelab.SkiActivity',
              'com.yamo.snorelab.SkiSessionDetailActivity',
              'com.yamo.snorelab.SkiWaitTimesActivity',
              'com.yamo.snorelab.SkiRecorderService',
              'com.yamo.snorelab.SnowGeofenceReceiver',
          ]
          for name in required:
              m = re.search(r'<(?:activity|service|receiver)\b[^>]*android:name="[.]?'+re.escape(name.split('.')[-1])+r'"[^>]*>', text)
              if not m:
                  m = re.search(r'<(?:activity|service|receiver)\b[^>]*android:name="'+re.escape(name)+r'"[^>]*>', text)
              if not m or 'android:enabled="false"' not in m.group(0):
                  raise SystemExit(f'Snow release gate missing for {name}')
          print('Release Snow component gate verified:', release[-1])
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-v0.30.00-real-settings-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
