name: Build Yamone Android APK

on:
  push:
    branches: [main, renewal-v23]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'dev-signing/**'
      - 'design-preview/**'
      - 'design-source/**'
      - 'tools/import-yamone-v23.sh'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import approved design + v0.26.01 records cleanup
        shell: bash
        run: bash tools/import-yamone-v23.sh design-source/yamone-v23.zip

      - name: Validate app JavaScript and records cleanup
        shell: bash
        run: |
          node --check app/src/main/assets/yamone-v23/v02501-ui.js
          node --check app/src/main/assets/yamone-v23/v02505-summary.js
          node --check app/src/main/assets/yamone-v23/v02507-move.js
          node --check app/src/main/assets/yamone-v23/v02507-fit.js
          node --check app/src/main/assets/yamone-v23/v02501-navigation.js
          node --check app/src/main/assets/yamone-v23/v02508-real-move.js
          node --check app/src/main/assets/yamone-v23/v02510-ui.js
          node --check app/src/main/assets/yamone-v23/v02511-home-active.js
          node --check app/src/main/assets/yamone-v23/v02512-notification.js
          node --check app/src/main/assets/yamone-v23/v02513-records.js
          node --check app/src/main/assets/yamone-v23/v02514-partial-pace.js
          node --check app/src/main/assets/yamone-v23/v02515-record-detail.js
          node --check app/src/main/assets/yamone-v23/v02516-auto-detect.js
          node --check app/src/main/assets/yamone-v23/v02516-version.js
          grep -q "v02510UpdateGlance" app/src/main/assets/yamone-v23/v02508-real-move.js
          grep -q "homeMovementRunning" app/src/main/assets/yamone-v23/v02511-home-active.js
          grep -q "yamoneOpenActiveMovement" app/src/main/assets/yamone-v23/v02512-notification.js
          grep -q "getSavedRecords" app/src/main/java/com/yamo/snorelab/SavedMovementRecordsBridge.java
          grep -q "getSavedRecordDetail" app/src/main/java/com/yamo/snorelab/SavedMovementRecordsBridge.java
          grep -q "SavedMovementRecordsBridge(this)" app/src/main/java/com/yamo/snorelab/YamoneMovementActivity.java
          grep -q "AutoDetectSettingsBridge(this)" app/src/main/java/com/yamo/snorelab/YamoneMovementActivity.java
          grep -q "AutoDetectSettingsBridge(this)" app/src/main/java/com/yamo/snorelab/YamoneDesignPreviewActivity.java
          grep -q "requestActivityTransitionUpdates" app/src/main/java/com/yamo/snorelab/ActivityAutoDetectManager.java
          grep -q "ACTION_CANCEL" app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q "KEY_STARTED_BY_AUTO_DETECT" app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q "기록 취소" app/src/main/assets/yamone-v23/v02516-auto-detect.js
          grep -q "GPS 상태:" app/src/main/assets/yamone-v23/v02516-auto-detect.js
          grep -q "movementNotificationIntent(true)" app/src/main/java/com/yamo/snorelab/WalkingRecorderService.java
          grep -q "저장된 기록" app/src/main/assets/yamone-v23/v02513-records.js
          ! grep -q "(sample)" app/src/main/assets/yamone-v23/v02513-records.js
          ! grep -q "2026년 08월" app/src/main/assets/yamone-v23/v02513-records.js
          grep -q "0.26.01" app/src/main/assets/yamone-v23/v02516-version.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed development signing key
        shell: bash
        run: |
          mkdir -p dev-signing
          base64 -d dev-signing/yamone-dev.keystore.b64 > dev-signing/yamone-dev.keystore
          keytool -list -keystore dev-signing/yamone-dev.keystore -storepass android -alias yamone-dev >/dev/null

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-v0.26.01-no-sample-records-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
