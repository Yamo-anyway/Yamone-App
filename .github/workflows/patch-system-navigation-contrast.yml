name: Fix Android system navigation button contrast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-system-navigation-contrast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch light navigation bar contrast
        run: |
          python3 - <<'PY'
          from pathlib import Path

          theme = Path('app/src/main/res/values/themes.xml')
          s = theme.read_text()
          if 'android:windowLightNavigationBar' not in s:
              s = s.replace(
                  '<item name="android:windowLightStatusBar">true</item>',
                  '<item name="android:windowLightStatusBar">true</item>\n        <item name="android:windowLightNavigationBar">true</item>'
              )
              theme.write_text(s)

          main = Path('app/src/main/java/com/yamo/snorelab/MainActivity.java')
          s = main.read_text()
          old = '''        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {\n            getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);\n        }'''
          new = '''        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {\n            int flags = getWindow().getDecorView().getSystemUiVisibility();\n            flags |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n                flags |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;\n            }\n            getWindow().getDecorView().setSystemUiVisibility(flags);\n        }'''
          if old not in s:
              raise SystemExit('MainActivity system bar pattern not found')
          main.write_text(s.replace(old, new, 1))

          alarm = Path('app/src/main/java/com/yamo/snorelab/AlarmActivity.java')
          s = alarm.read_text()
          old = '''        if (Build.VERSION.SDK_INT >= 23) {\n            getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);\n        }'''
          new = '''        if (Build.VERSION.SDK_INT >= 23) {\n            int flags = getWindow().getDecorView().getSystemUiVisibility();\n            flags |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;\n            if (Build.VERSION.SDK_INT >= 26) {\n                flags |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;\n            }\n            getWindow().getDecorView().setSystemUiVisibility(flags);\n        }'''
          if old not in s:
              raise SystemExit('AlarmActivity system bar pattern not found')
          alarm.write_text(s.replace(old, new, 1))
          PY
      - name: Verify
        run: |
          grep -q 'windowLightNavigationBar' app/src/main/res/values/themes.xml
          grep -q 'SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR' app/src/main/java/com/yamo/snorelab/MainActivity.java
          grep -q 'SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR' app/src/main/java/com/yamo/snorelab/AlarmActivity.java
      - name: Commit
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/res/values/themes.xml app/src/main/java/com/yamo/snorelab/MainActivity.java app/src/main/java/com/yamo/snorelab/AlarmActivity.java
          git commit -m 'Fix Android system navigation button contrast'
          git push
