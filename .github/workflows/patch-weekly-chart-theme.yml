name: Apply Yamone weekly chart theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-weekly-chart-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply weekly chart theme
        run: python3 .github/scripts/patch_weekly_chart_theme.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/EnhancedExerciseActivity.java
          git commit -m 'Match weekly activity chart to Yamone theme'
          git push
