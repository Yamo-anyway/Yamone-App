name: Patch activity chart labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-chart-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean chart labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/src/main/java/com/yamo/snorelab/ActivityDetailStatsEnhancer.java'): [
                  ('"활동 전체 시간에 따른 GPS 고도 변화"', '"전체 기록 · 두 손가락 확대 · 좌우 이동"'),
                  ('"GPS가 안정된 구간의 이동 속도 변화"', '"GPS 안정 구간 · 두 손가락 확대 · 좌우 이동"'),
                  ('"고도 변화"', '"고도"'),
                  ('"속도 변화"', '"속도"'),
              ],
              Path('app/src/main/java/com/yamo/snorelab/HikingActivity.java'): [
                  ('"경로와 고도 변화를 확인해요"', '"경로와 고도를 확인해요"'),
                  ('"활동 전체 시간에 따른 고도 변화"', '"전체 기록 · 두 손가락 확대 · 좌우 이동"'),
                  ('"이동 속도 변화"', '"속도"'),
                  ('"고도 변화"', '"고도"'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify labels
        shell: bash
        run: |
          ! grep -R '고도 변화\|속도 변화' app/src/main/java/com/yamo/snorelab/ActivityDetailStatsEnhancer.java app/src/main/java/com/yamo/snorelab/HikingActivity.java
          grep -q '두 손가락 확대 · 좌우 이동' app/src/main/java/com/yamo/snorelab/ActivityDetailStatsEnhancer.java

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/ActivityDetailStatsEnhancer.java app/src/main/java/com/yamo/snorelab/HikingActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refine activity chart labels'
          git push
