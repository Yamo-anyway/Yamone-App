name: Apply Yamone location status countdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-location-status-countdown-v049.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply location status countdown
        run: python3 .github/scripts/patch_location_status_countdown_v049.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/LocationSharingActivity.java
          git commit -m 'Show countdown to next location status check'
          git push
