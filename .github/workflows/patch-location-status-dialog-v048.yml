name: Apply Yamone location status dialog polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-location-status-dialog-v048.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply custom location status dialogs
        run: python3 .github/scripts/patch_location_status_dialog_v048.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/LocationSharingActivity.java
          git commit -m 'Polish help and emergency status dialogs'
          git push
