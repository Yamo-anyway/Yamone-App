name: Apply Yamone home dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-home-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply home dashboard
        run: python3 .github/scripts/patch_home_dashboard.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/MainActivity.java
          git commit -m 'Refresh Yamone home dashboard UI'
          git push
