name: Fix Yamone sleep newline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sleep-newline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix sleep hint newline
        run: python3 .github/scripts/fix_sleep_newline.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/MainActivity.java
          git commit -m 'Fix sleep overview hint newline'
          git push
