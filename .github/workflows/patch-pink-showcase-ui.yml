name: Apply pink Yamone showcase UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pink-showcase-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI patch
        run: python3 .github/scripts/patch_pink_showcase_ui.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main
          git commit -m 'Apply pink Yamone main UI and launcher icon'
          git push
