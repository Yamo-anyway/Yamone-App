name: Apply activity pause and ski stop recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-activity-pause-ski-stop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply activity follow-up fixes
        run: python3 .github/scripts/patch_activity_pause_ski_stop.py
      - name: Commit changes
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab
          git commit -m 'Fix paused steps and ski stop recovery'
          git push
