name: Patch Yamone v0.3.58 room form stability v2

on:
  push:
    paths:
      - '.github/workflows/patch-v058-room-form-stability-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply room form stability patch
        run: python3 .github/scripts/patch_v058_room_form_stability.py

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yamo/snorelab/LocationSharingActivity.java app/src/main/AndroidManifest.xml app/build.gradle
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Stabilize room form layout and room card icon"
          git push
