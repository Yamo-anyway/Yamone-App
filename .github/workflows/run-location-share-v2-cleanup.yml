name: Apply location sharing V2 cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-location-share-v2-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/scripts/patch_location_share_v2.py
      - name: Verify
        run: |
          ! grep -R -n -E '내 닉네임 변경|showYamoneNicknameDialog|updateNickname\(|replaceNicknameAction|maybeSendImmediateLocation|immediateReportAttempted|reportLocationQuietly' app/src/main/java/com/yamo/snorelab/LocationSharingActivityV2.java
      - name: Commit
        run: |
          git config user.name 'Yamone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yamo/snorelab/LocationSharingActivityV2.java
          git commit -m 'Remove nickname edit and legacy immediate location path'
          git push
