plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yamo.snorelab'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yamo.snorelab'
        minSdk 26
        targetSdk 36
        versionCode 51
        versionName '0.3.48-location-status-dialog-polish'
        manifestPlaceholders = [appLabel: '야모네']
    }

    signingConfigs {
        yamoneDev {
            // Development-only key. Production/release signing must use a separate private key.
            storeFile rootProject.file('dev-signing/yamone-dev.keystore')
            storePassword 'android'
            keyAlias 'yamone-dev'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            // Dedicated Yamone-App test package. Keeps legacy test installs/data untouched.
            applicationIdSuffix '.yamone'
            versionNameSuffix '-dev'
            manifestPlaceholders = [appLabel: '야모네']
            signingConfig signingConfigs.yamoneDev
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:13.4.1'
}