plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yamo.snorelab'
    compileSdk 36
    defaultConfig {
        applicationId 'com.yamo.snorelab'
        minSdk 26
        targetSdk 36
        versionCode 94
        versionName '0.36.00'
        manifestPlaceholders = [appLabel: '야모네', snowFeatureEnabled: 'false']
    }
    signingConfigs {
        yamoneDev {
            storeFile rootProject.file('dev-signing/yamone-dev.keystore')
            storePassword 'android'
            keyAlias 'yamone-dev'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.yamone'
            versionNameSuffix '-dev'
            manifestPlaceholders = [appLabel: '야모네', snowFeatureEnabled: 'true']
            signingConfig signingConfigs.yamoneDev
        }
        release {
            manifestPlaceholders = [appLabel: '야모네', snowFeatureEnabled: 'false']
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:13.4.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
